# Asistente de rutas (F6, fila 4). DEC-03 (15/10/2026): OCI Language + reglas + plantillas, sin LLM.
# CRITERIO PROPIO: palabras, umbrales y textos los fija el equipo; no son datos oficiales.
# Las palabras se comparan sin tildes ni mayusculas y por inicio de palabra («fuente» vale para «fuentes»).
own_criterion: true

interpret:
  max_distance_km: 42            # mismo tope que AssistantParams (contrato)
  max_duration_min: 480
  default_activity: walk
  activities:                    # actividad del contrato -> palabras
    walk: [caminar, caminando, camina, andar, andando, anda, pasear, paseo, paseando, senderismo]
    run: [correr, corriendo, corre, carrera, running, trotar, trote, footing, jogging]
  pass_by:                       # pasar por (RF-21) -> palabras; la mas larga gana («parque infantil» -> juegos)
    park: [parque, jardin, zona verde, zonas verdes]
    fountain: [fuente, beber agua]
    bench: [banco, sentarme, sentarse]
    supermarket: [supermercado, super, hipermercado, tienda de alimentacion]
    dog_area: [perro, area canina, zona canina, pipican]
    playground: [parque infantil, juegos infantiles, juegos, columpio, tobogan, area infantil, zona infantil]
  avoid:                         # evitar (RF-21) -> palabras; solo cuentan con una negacion delante («sin cuestas»)
    traffic: [trafico, coches, avenida, carretera]
    hills: [cuesta, pendiente, subida, desnivel, repecho]
  avoid_direct:                  # cuentan como «evitar» sin negacion
    hills: [llano, llana, plano, plana]
  negations: [sin, ni, evitar, evitando, evita, "no", nada, lejos, poco, poca, menos]
  negation_window: 3             # palabras hacia atras en las que una negacion afecta a la palabra
  negation_breaks: [con, "y", pero, aunque, pasando]   # cortan el alcance de la negacion (tambien la puntuacion); «no» e «y» entre comillas: sin ellas YAML podria leer un booleano
  one_way: [solo ida, de ida, sin volver, sin vuelta]
  out_of_catalog: [nadar, natacion, piscina, bici, patin, esqui, escalar, escalada, padel, tenis, futbol,
                   baloncesto, gimnasio]
  medical: [medic, tension, hipertens, corazon, cardiac, infarto, asma, dolor, duele, enfermedad, enfermo,
            lesion, lesionad, rodilla, operad, medicacion, medicamento, pastilla, diabetes, colesterol, embaraz,
            artrosis, rehabilitacion, fisioterap, sintoma]
  distance_units: {kilometros: 1, kilometro: 1, kms: 1, km: 1, metros: 0.001, metro: 0.001, m: 0.001}
  duration_units: {minutos: 1, minuto: 1, mins: 1, min: 1, horas: 60, hora: 60, h: 60}
  duration_phrases: {hora y media: 90, media hora: 30, una hora: 60, dos horas: 120, tres cuartos de hora: 45}
  quantity_entity_types: [QUANTITY, DATETIME]   # entidades de OCI Language que se leen como distancia o duracion

messages:
  medical: "No puedo responder a eso: GoMad no da consejo médico. Consulta a tu centro de salud. Puedo ayudarte a planear una ruta a pie."
  out_of_catalog: "El asistente solo prepara rutas para caminar o correr. Para otras actividades, usa «¿Qué te apetece hacer?» en Mi entorno."
  missing_amount: "¿Qué distancia o cuánto tiempo quieres andar o correr? Por ejemplo: «5 km» o «45 minutos»."
  which_activity: "¿Quieres caminar o correr? Dímelo para calcular el ritmo."
  too_long: "Como mucho puedo preparar rutas de 42 km o de 8 horas. ¿Qué distancia o cuánto tiempo quieres?"

oci:
  timeout_s: 3              # segundos de conexion y de lectura; despues, solo diccionario (criterio propio)
  language_code: es

templates:                       # write_up: la explicacion solo usa datos del motor (RF-23)
  summary: "{summary}."
  score: " Cumple {met} de {total} condiciones."
  failed: " No cumple: {failed}."
  join_last: " y "

route:                           # /assistant/route sin ruta circular (fila 4); la circular por distancia es de la fila 5
  search_radius_m: 2000          # radio alrededor de la salida para buscar cada punto de paso (criterio propio)
  candidates: 20                 # puntos por tipo que se piden para saltar los fuera de servicio
  pass_by_radius_m: 50           # «pasar por» un punto = la ruta pasa a menos de esto (criterio propio)
  default_destination: park      # sin puntos de paso, la ruta va al parque mas cercano (R1 del plan)
  tolerance: 0.10                # distancia o duracion objetivo: ±10 % (RF-22)
  avoid_traffic_max_share: 0.10  # «evitar trafico» se cumple con <= 10 % del recorrido junto a trafico (criterio propio)
  avoid_traffic_weights: {traffic: 1.0, green: 0.5, fountains: 0.2}
  destination_kinds: [park]      # pasar por que son destinos (tabla destination)
  poi_kinds: [fountain, bench, dog_area, playground]   # pasar por que son puntos de ruta (tabla route_poi)
  no_data:                       # pasar por sin datos cargados (comprobado el 18/10: no hay supermercados)
    supermarket: "Sin datos de supermercados cargados en GoMad: no se puede comprobar."
  labels:                        # nombre de cada condicion
    park: parque
    fountain: fuentes
    bench: bancos
    supermarket: supermercado
    dog_area: área canina
    playground: juegos infantiles
    traffic: tráfico
    hills: cuestas
  endings:                       # «termina en ...» de cada tipo de punto (los parques llevan su nombre)
    park: "«{name}»"
    fountain: una fuente
    bench: un banco
    dog_area: un área canina
    playground: unos juegos infantiles
  texts:
    distance: "Distancia de {target} (±{tolerance} %)"
    duration: "Duración de {target} (±{tolerance} %)"
    distance_met: "La ruta mide {actual}."
    duration_met: "La ruta dura {actual}."
    target_unmet: "La ruta sale de {actual}: el ajuste a una distancia objetivo todavía no está disponible."
    loop: Circular
    loop_met: Vuelve al punto de salida.
    loop_unmet: "La ruta circular todavía no está disponible: esta ruta es solo de ida y termina en {end}."
    one_way: Solo ida
    one_way_met: "Termina en {end}."
    pass_by: "Pasar por: {label}"
    place_met: "Pasa por {end}."
    count_met: "{n} a menos de {radius} m de la ruta."
    none_nearby: "No hay ninguno a menos de {radius} de la salida."
    not_on_route: "Hay uno a {distance} de la salida, pero la ruta no pasa a menos de {radius} m."
    avoid: "Evitar: {label}"
    traffic: "{traffic} junto a tráfico ({share} % del recorrido)."
    hills: "Sin datos de desnivel todavía: no se puede comprobar."
    no_network: "Sin red peatonal cargada en esta zona: no se puede comprobar."
    summary_one_way: "Ruta saludable de ida hasta {end}: {description}"
    summary_approximate: "Ruta aproximada hasta {end}: {description}"
    summary_loop: "Ruta saludable circular: {description}"
    summary_default: "Como no has pedido pasar por ningún sitio, la ruta va al parque más cercano, {end}: {description}"
    summary_fallback: "No hay ninguno de los puntos pedidos cerca, así que la ruta va al parque más cercano, {end}: {description}"
