# Datos en vivo en memoria (DEC-15, B2): la API los pide en segundo plano y nunca muestra un dato
# observado hace mas de max_age_h. Por fuente: url, ttl_s (cada cuanto se vuelve a pedir), max_age_h
# (antiguedad maxima del dato que se muestra) y timeout_s. Sin persistencia salvo la cache de arranque de la prevision.
# CRITERIO PROPIO salvo el max_age_h de 12 h de la prevision (DEC-13) y los limites de uso de Open-Meteo.
own_criterion: true
tick_s: 5                  # cada cuanto mira el hilo de fondo si toca refrescar algo
retry_failed_s: 60         # tras un fallo, una fuente se reintenta como mucho cada tanto (o su TTL si es menor)
air_buffer_h: 24           # lecturas de aire que se guardan para las medias moviles del ICA (PM 24 h)
sources:
  air_cm:                  # aire_dia (CKAN Comunidad): misma URL que el manifiesto de la ingesta
    url: "https://datos.comunidad.madrid/dataset/3dacd589-ecca-485c-81b9-a61606b7199f/resource/ee75d31c-8042-4067-bbd7-739bb3eb8059/download/calidad_aire_datos_dia.csv"
    ttl_s: 600
    max_age_h: 4           # tope POR ESTACION (16/10): la red CM publica con ~3 h de retraso; se usa la ultima medicion
    timeout_s: 10
  air_ay:                  # ay_aire (Ayuntamiento de Madrid)
    url: "https://ciudadesabiertas.madrid.es/dynamicAPI/API/query/calair_tiemporeal.csv?pageSize=5000"
    ttl_s: 600
    max_age_h: 4
    timeout_s: 10
  forecast:                # Open-Meteo (DEC-16): los 179 municipios en UNA peticion, sin clave
    # el codigo anade &latitude=...&longitude=... con los puntos de «points» (nunca la ubicacion de la persona)
    url: "https://api.open-meteo.com/v1/forecast?hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max&forecast_days=3&timezone=Europe%2FMadrid"
    points: forecast_points.csv  # app/config: un punto por municipio (ine_code,name,lat,lon)
    weather_codes: weather_codes.yaml
    ttl_s: 3600            # una peticion por hora: 179 x 24 = 4.296 coordenadas/dia (limite 10.000/dia, 5.000/h)
    max_age_h: 12          # prevision descargada hace mas de 12 h no se usa (DEC-13, se mantiene)
    timeout_s: 30
    retry_s: 120           # tras un fallo (429, red), espera GLOBAL que se duplica en cada fallo seguido...
    retry_max_s: 3600      # ...hasta este tope; nunca una peticion por tick
  air_forecast:            # Copernicus CAMS via Open-Meteo (fila 2, 17/10): O3, NO2, PM10 y PM2.5 previstos, sin clave
    # el codigo anade &latitude=...&longitude=... con los puntos de «points» (nunca la ubicacion de la persona).
    # past_days=1: 24 h previas para que las medias del ICA (PM 24 h, O3 8 h) de las primeras horas esten completas
    url: "https://air-quality-api.open-meteo.com/v1/air-quality?hourly=ozone,nitrogen_dioxide,pm10,pm2_5&past_days=1&forecast_days=3&timezone=Europe%2FMadrid"
    points: forecast_points.csv
    ttl_s: 10800           # cada 3 h: 179 x 8 = 1.432 coordenadas/dia; con la prevision, 5.728 de 10.000/dia (CAMS Europa se elabora 1 vez al dia)
    max_age_h: 24          # prevision de aire descargada hace mas de 24 h no se usa
    timeout_s: 30
    retry_s: 120           # tras un fallo, espera GLOBAL que se duplica en cada fallo seguido...
    retry_max_s: 3600      # ...hasta este tope; nunca una peticion por tick
