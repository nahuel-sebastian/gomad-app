# Buscador de ubicacion GET /location (RF-01, D-04; correccion C1, 17/10/2026). CRITERIO PROPIO: la app lo dice.
own_criterion: true
max_candidates: 8        # candidatos devueltos como mucho (municipios + calles)
max_municipalities: 5    # municipios como mucho al principio, para dejar sitio a las calles («san»)
min_prefix_len: 3        # palabras de 3+ letras valen como prefijo («geta» -> Getafe); las mas cortas, enteras
remote_timeout_s: 2.0    # espera maxima a Nomecalles (antes 3 s en el codigo); medido ~1 s en el peor caso
remote_min_similarity: 0.8  # vial de Nomecalles valido: una palabra del texto es prefijo o se parece tanto (erratas)
