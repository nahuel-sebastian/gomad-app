# Valores de DEC-07 (15/10/2026): se mantienen los provisionales de Task 20. Criterio propio.
# Lo leen ingest (graph.py: traffic, poi_radius_m) y api (rutas: cost_floor, pesos, umbral).
traffic_by_highway:     # 0 = sin trafico, 1 = maximo. Criterio propio salvo que se cite otra fuente.
  primary: 1.0
  primary_link: 1.0
  secondary: 0.8
  secondary_link: 0.8
  tertiary: 0.6
  tertiary_link: 0.6
  unclassified: 0.4
  residential: 0.3
  service: 0.2
  cycleway: 0.1
  living_street: 0.1
  track: 0.0
  path: 0.0
  footway: 0.0
  pedestrian: 0.0
  steps: 0.0
default_traffic: 0.3
cost_floor: 0.5         # arquitectura §4.4: factor >= 0,5
poi_radius_m: 25
snap_max_m: 300        # distancia maxima de un punto a la red peatonal (criterio propio)
traffic_display_threshold: 0.5
default_route_weights: {traffic: 0.5, green: 0.5, fountains: 0.2}
# Poligonos de OSM que cuentan como zona verde en los municipios sin VPLA (S-R1, criterio propio).
# Solo se usan donde no hay planeamiento; donde hay VPLA manda VPLA.
osm_green:
  leisure: [park, garden, nature_reserve]
  landuse: [forest, grass, recreation_ground, village_green, meadow]
  natural: [wood]
# Mobiliario de OSM en route_poi (C2b, criterio propio). Etiquetas comprobadas en el extracto del 17/10.
osm_poi:
  out_of_service:            # tipo -> etiquetas que dan working = false (la ruta no lo cuenta); "no" entre comillas: sin ellas YAML lo lee como false
    fountain:
      drinking_water: ["no"]
      operational_status: ["closed"]
  skip_where_official:       # municipio -> tipos que ya da una fuente oficial (Ayuntamiento de Madrid): no se cargan de OSM
    "28079": [bench, fountain, dog_area]
own_criterion: true
# Ruta por distancia objetivo, circular o de ida (RF-22, fila 5). Solo la tolerancia viene de RF-22;
# el resto es criterio propio, ajustado para quedar por debajo de 5 s en el grafo regional.
loop:
  tolerance: 0.10             # RF-22: +-10 % de la distancia objetivo
  leg_fraction: 0.333         # primer punto automatico a ~objetivo/3 (ruta en triangulo)
  candidate_tolerance: 0.05   # margen para elegir candidato por distancia de red estimada
  initial_scale: 1.1          # relacion inicial ruta saludable / distancia mas corta
  turn_deg: 60                # giro del rumbo del punto siguiente (triangulo equilatero)
  bearing_step_deg: 90        # giro del rumbo inicial entre intentos
  initial_bearing_deg: 0      # 0 = norte
  max_attempts: 8
  rescales_per_direction: 2   # intentos reescalados antes de girar el rumbo
  reuse_penalty: 3.0          # multiplica el coste de los tramos ya recorridos (evita ir y volver)
  radius_margin: 1.2          # radio del subgrafo respecto al punto pedido mas lejano
  time_budget_s: 3.0          # presupuesto de intentos; la peticion entera < 5 s (RNF)
  own_criterion: true
