# Inicializa los datos de un equipo nuevo (descarga, normaliza, bases y grafo) en app/data.
# Solo para equipos de desarrollo; no forma parte del despliegue. Desde app/:
#   docker compose -f deploy/docker-compose.init.yml run --rm ingest
# Despues, la app normal: docker compose -f deploy/docker-compose.yml up -d --build
services:
  ingest:
    build: ../ingest
    # escribe app/data con el usuario del equipo, no como root (en Linux, `id -u` / `id -g` si no es 1000)
    user: "${GOMAD_UID:-1000}:${GOMAD_GID:-1000}"
    # app/.env si existe (ninguna fuente de la ingesta necesita clave: la prevision es Open-Meteo, DEC-16)
    env_file:
      - path: ../.env
        required: false
    environment:
      GOMAD_DATA_DIR: /data
      GOMAD_CONFIG_DIR: /config
    volumes:
      # GOMAD_DATA_PATH permite generar en otra carpeta (por defecto, app/data)
      - ${GOMAD_DATA_PATH:-../data}:/data
      - ../config:/config:ro
