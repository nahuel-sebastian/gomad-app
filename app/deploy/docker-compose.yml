services:
  api:
    build: ../api
    env_file: ../.env
    volumes:
      - ../data:/data:ro
      # unica carpeta con escritura: cache de la prevision en vivo (B2), para que sobreviva a los reinicios
      - ../data/live:/data/live
      - ../config:/config:ro
      # credenciales de OCI Language (F6, DEC-03) en solo lectura; el key_file del config debe ser /oci/<clave>.pem.
      # OCI_DIR en app/deploy/.env si no estan en ~/.oci (si la carpeta no existe, Docker la crea vacia: solo diccionario)
      - ${OCI_DIR:-${HOME}/.oci}:/oci:ro
    # gana a app/.env: dentro del contenedor el config de OCI siempre esta aqui (no depende de ~ ni del usuario)
    environment:
      OCI_CONFIG_FILE: /oci/config
    restart: unless-stopped
  frontend:
    build: ../frontend
    ports:
      - "80:80"
      - "443:443"
    # solo DOMAIN, interpolado desde app/deploy/.env (sin claves): Caddy es el contenedor expuesto
    # y no debe recibir las de app/.env. Sin definir o vacio, compose no arranca
    environment:
      DOMAIN: ${DOMAIN:?Falta DOMAIN en app/deploy/.env (":80" en local, el dominio en la VM)}
    volumes:
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped
volumes:
  caddy_data:
