services:
  api:
    build: ../api
    env_file: ../.env
    volumes:
      - ../data:/data:ro
      - ../config:/config:ro
    restart: unless-stopped
  frontend:
    build: ../frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-:80}
    volumes:
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped
volumes:
  caddy_data:
