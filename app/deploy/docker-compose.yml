services:
  api:
    build: ../api
    env_file: ../.env
    volumes:
      - ../data:/data:ro
      - ../config:/config:ro
    restart: unless-stopped
  frontend:
    build: ../frontend
    ports:
      - "80:80"
      - "443:443"
    # DOMAIN se lee de app/.env (sin DOMAIN, el Caddyfile usa :80, solo HTTP)
    env_file: ../.env
    volumes:
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped
volumes:
  caddy_data:
